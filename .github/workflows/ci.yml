name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" --break-system-packages 2>/dev/null || pip install -e ".[dev]"

      - name: Run tests
        env:
          # No secrets — tests must pass with no external credentials
          LOG_LEVEL: WARNING
        run: pytest tests/ -v --tb=short --cov=fx_engine --cov-report=term-missing

      - name: Check no secrets in logs
        run: |
          # Verify .env is in .gitignore
          grep -q "^\.env" .gitignore || (echo ".env not in .gitignore" && exit 1)
          echo "Secrets check passed."
